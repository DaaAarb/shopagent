# Integración continua: en cada push a main y en cada pull request se comprueba
# que el backend pasa lint y tests y que el frontend pasa lint y compila.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Contenedores que Actions arranca junto al job, accesibles en localhost.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shopagent
          POSTGRES_PASSWORD: shopagent
          POSTGRES_DB: shopagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # pydantic-settings las lee del entorno: en CI no hay .env.
    env:
      TEST_DATABASE_URL: postgresql+psycopg://shopagent:shopagent@localhost:5432/shopagent_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (incluye comprobación de tipos)
        run: npm run build
