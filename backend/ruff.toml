# Lint del backend: `ruff check .` (desde backend/).
# Solo errores reales, no estilo: sintaxis (E9), imports y sentencias mal
# colocadas (E4, E7) y pyflakes (F: imports sin usar, nombres no definidos...).
# Se fijan a mano para que no cambien al actualizar ruff.
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F"]
